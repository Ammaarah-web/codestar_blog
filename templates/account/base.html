{% extends "base.html" %}

{% load i18n %}

{% block content %}
<div class="container mt-5">
    {% if messages %}
    <div class="row">
        <div class="col-md-8 mt-3 offset-md-2">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
    </div>
    {% endif %}

    {% block body %}
    {% block inner_content %}
    {% endblock inner_content %}
    {% endblock body %}
</div>
{% endblock content %}
